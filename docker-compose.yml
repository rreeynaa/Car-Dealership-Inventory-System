services:
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: development
      SEED_ON_STARTUP: "true"
      DATABASE_URL: postgresql+psycopg://dealership:dealership@db:5432/dealership
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealership
      POSTGRES_PASSWORD: dealership
      POSTGRES_DB: dealership
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealership"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: